<style>
:root{--bg:#1b1020;--fg:#f6e9d7;--muted:#cdb9a3;--accent:#d2603a;--gold:#e3a857}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Hanken Grotesk",system-ui,sans-serif;display:grid;place-items:center;padding:24px;min-height:100svh;overflow:hidden}
.sky{position:fixed;inset:0;background:
  radial-gradient(120% 70% at 50% 110%,#e07a3f 0%,#b1442f 22%,#6d2a3a 45%,#2b1730 72%,#1b1020 100%)}
.sky::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff7 50%,transparent 51%),radial-gradient(1.4px 1.4px at 38% 8%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 88% 30%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 22% 36%,#fff5 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 26%,#fff7 50%,transparent 51%)}
.sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:38vh;min-height:220px}
.card{position:relative;z-index:2;width:min(420px,100%);text-align:center;padding:34px 28px 28px;border-radius:22px;background:rgba(27,16,32,.55);border:1px solid rgba(246,233,215,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.star{width:44px;height:44px;margin:0 auto 14px;color:var(--gold)}
.eb{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(32px,8vw,42px);line-height:1.05;margin:10px 0 8px}
h1 i{font-style:italic;font-weight:500;color:var(--gold)}
p{margin:0 0 22px;color:var(--muted);font-size:15px}
form{display:flex;flex-direction:column;gap:10px}
input[type=password]{font:inherit;font-size:16px;padding:14px 16px;border-radius:12px;border:1px solid rgba(246,233,215,.22);background:rgba(0,0,0,.25);color:var(--fg);text-align:center;letter-spacing:.06em}
input[type=password]:focus{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;font-size:15px;padding:13px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.7;cursor:progress}
label.rm{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);margin-top:2px;cursor:pointer}
label.rm input{accent-color:var(--accent);width:16px;height:16px}
.err{min-height:20px;font-size:13px;color:#ffb39c}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
body.auto .card{opacity:0}
noscript{display:block;margin-top:12px;color:#ffb39c;font-size:13px}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

(function(){
  var f=document.getElementById("f"),pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err"),rm=document.getElementById("rm");
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function u2b(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
  function derive(p){return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"])

    });}
